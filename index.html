<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3日間タスク">
<title>3日間タスク</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131311" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f6f6f4; --panel:#ffffff; --line:#e3e2dd; --line-soft:#eeedea;
  --ink:#1c1b19; --ink-2:#5f5d57; --ink-3:#8d8a82;
  --accel:#1f6f4a; --accel-bg:#e4f0e9;
  --routine:#8a5a12; --routine-bg:#f6ecd9;
  --done:#9a9790; --today:#1c1b19;
  --warn:#a8341f;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px -16px rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131311; --panel:#1c1c1a; --line:#2e2e2b; --line-soft:#26251f;
    --ink:#eceae4; --ink-2:#a5a29a; --ink-3:#76736c;
    --accel:#7fd0a4; --accel-bg:#1b3128;
    --routine:#e3b169; --routine-bg:#332715;
    --done:#6a6760; --today:#eceae4;
    --warn:#f0917c;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px; line-height:1.6;
  padding:0 0 env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 56px}

header{
  position:sticky; top:0; z-index:10;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  margin:0 -14px 16px;
  display:flex; align-items:baseline; gap:10px;
}
h1{font-size:16px;font-weight:650;margin:0;letter-spacing:.02em}
.sub{font-size:12px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}
.reload{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
  font:inherit;font-size:12px;padding:3px 10px;border-radius:999px;cursor:pointer;
}
.reload:active{opacity:.6}

.day{margin:0 0 22px}
.day-head{
  display:flex; align-items:baseline; gap:8px;
  padding:0 2px 8px; border-bottom:1px solid var(--line);
  margin-bottom:10px;
}
.day-date{font-size:13px;font-weight:650;letter-spacing:.03em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.day-rel{font-size:11px;color:var(--ink-3)}
.day-count{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.day.is-today .day-date{color:var(--today)}
.day.is-today .day-head{border-bottom-color:var(--ink-3)}
.day.is-today .day-rel{
  color:var(--bg); background:var(--ink); border-radius:999px;
  padding:1px 7px; font-weight:650;
}

.task{
  background:var(--panel); border:1px solid var(--line); border-radius:11px;
  padding:11px 13px; margin-bottom:7px; box-shadow:var(--shadow);
  display:grid; grid-template-columns:auto 1fr; gap:0 11px; align-items:start;
}
.box{
  width:19px;height:19px;border-radius:6px;border:1.5px solid var(--ink-3);
  margin-top:2px; display:grid; place-items:center; flex:none;
  padding:0; background:transparent; appearance:none;
}
.task.can-edit{grid-template-columns:auto 1fr auto}
.del{
  appearance:none;border:0;background:transparent;color:var(--ink-3);
  font:inherit;font-size:15px;line-height:1;padding:2px 0 2px 8px;margin-top:1px;
  cursor:pointer;flex:none;
}
.del:active{color:var(--warn)}
button.box{cursor:pointer}
button.box:active{transform:scale(.9)}
.task.done .box{background:var(--ink-3);border-color:var(--ink-3)}
.task.done .box::after{content:"";width:9px;height:5px;border:2px solid var(--panel);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task.busy{opacity:.5}
.title{font-size:15px;font-weight:500;line-height:1.45;word-break:break-word}
.task.done .title{color:var(--done);text-decoration:line-through;text-decoration-thickness:1px;font-weight:400}

.meta{grid-column:2 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.tag{font-size:11px;line-height:1.5;padding:1px 8px;border-radius:999px;white-space:nowrap;font-weight:550}
.tag.t-accel{color:var(--accel);background:var(--accel-bg)}
.tag.t-routine{color:var(--routine);background:var(--routine-bg)}
.tag.t-proj{color:var(--ink-2);background:var(--line-soft);font-weight:500}
.tag.t-time{color:var(--ink-2);border:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:500}
.task.done .tag{opacity:.5}
.memo-add{
  appearance:none;border:1px dashed var(--line);background:transparent;color:var(--ink-3);
  font:inherit;font-size:11px;padding:1px 8px;border-radius:999px;cursor:pointer;
}
.memo-add:active{opacity:.6}

.memo{
  grid-column:2 / -1; margin-top:8px; padding:7px 10px;
  border-left:2px solid var(--line); background:var(--line-soft);
  border-radius:0 7px 7px 0;
  font-size:13px; color:var(--ink-2); white-space:pre-wrap; word-break:break-word;
}
.can-edit .memo{cursor:text}
.memo-edit{grid-column:2 / -1;margin-top:8px}
.memo-edit textarea{
  display:block;width:100%;min-height:64px;resize:vertical;
  font:inherit;font-size:13px;line-height:1.6;color:var(--ink);
  background:var(--panel);border:1px solid var(--ink-3);border-radius:7px;padding:7px 10px;
}
.memo-edit .row{display:flex;gap:6px;margin-top:6px}
.memo-edit button{
  appearance:none;font:inherit;font-size:12px;padding:4px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
}
.memo-edit button.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.memo-edit button:active{opacity:.6}

.empty{color:var(--ink-3);font-size:13px;padding:6px 2px 2px}
.note{font-size:12px;color:var(--ink-3);text-align:center;margin-top:26px;line-height:1.7}
.err{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;color:var(--ink-2);font-size:13px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--line-soft);padding:1px 5px;border-radius:4px}
details.other{margin-top:8px}
details.other summary{font-size:12px;color:var(--ink-3);cursor:pointer;padding:6px 2px}

#bar{
  display:flex;align-items:center;gap:8px;
  margin:0 0 14px;font-size:12px;color:var(--ink-3);
}
#mode{font-weight:600}
#mode.rw{color:var(--accel)}
#say{margin-left:auto;font-variant-numeric:tabular-nums}
#say.bad{color:var(--warn)}
.gear{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
  font:inherit;font-size:12px;padding:2px 10px;border-radius:999px;cursor:pointer;
}
.gear:active{opacity:.6}
#panel{
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:13px;margin:0 0 18px;box-shadow:var(--shadow);font-size:13px;color:var(--ink-2);
}
#panel[hidden]{display:none}
#panel h2{font-size:13px;font-weight:650;margin:0 0 8px;color:var(--ink)}
#panel p{margin:0 0 9px;line-height:1.65}
#panel ol{margin:0 0 9px;padding-left:1.3em;line-height:1.75}
#panel input{
  display:block;width:100%;font:inherit;font-size:13px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px;margin:0 0 8px;
}
#panel .row{display:flex;gap:6px}
#panel button{
  appearance:none;font:inherit;font-size:12px;padding:5px 13px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
}
#panel button.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
#panel button:active{opacity:.6}
#panel .warn{color:var(--warn)}
#panel a{color:inherit}

#quick{display:flex;gap:7px;margin:0 0 18px}
#quick[hidden]{display:none}
#quick input{
  flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:9px 12px;box-shadow:var(--shadow);
}
#quick input::placeholder{color:var(--ink-3)}
#quick input:focus{outline:none;border-color:var(--ink-3)}
#quick button{
  appearance:none;font:inherit;font-size:16px;line-height:1;font-weight:600;
  width:42px;flex:none;border-radius:11px;cursor:pointer;
  border:1px solid var(--ink);background:var(--ink);color:var(--bg);
}
#quick button:active{opacity:.6}
.day.is-anytime .day-rel{
  color:var(--ink-2); background:var(--line-soft); border-radius:999px;
  padding:1px 7px;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>3日間タスク</h1>
    <button class="reload" id="reload">更新</button>
    <span class="sub" id="stamp"></span>
  </header>

  <div id="bar">
    <span id="mode">読み取り専用</span>
    <button class="gear" id="gear">設定</button>
    <span id="say"></span>
  </div>

  <section id="panel" hidden>
    <h2>編集を有効にする</h2>
    <p>暗証番号を入れると、チェックとメモをタップで編集できます。<br>
       この端末に覚えさせるので、入れるのは1回だけです。</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="暗証番号">
    <div class="row">
      <button class="primary" id="pin-save">保存</button>
      <button id="pin-clear">削除</button>
      <button id="panel-close">閉じる</button>
    </div>
    <p style="margin-top:10px">
      消えてしまうのが煩わしければ、<code>?k=暗証番号</code> を付けた URL を<br>
      ホーム画面に追加してください。端末の記憶が消えても効きます。
    </p>
  </section>

  <form id="quick" hidden>
    <input id="quick-text" type="text" enterkeyhint="done" autocomplete="off"
           autocapitalize="off" spellcheck="false"
           placeholder="すぐできること…（日付なし）">
    <button type="submit" aria-label="追加">＋</button>
  </form>

  <main id="app"><div class="empty">読み込み中…</div></main>
  <p class="note">タスクは <code>tasks.txt</code> に保存されます。<br>日付付きの入れ替えは Claude に。</p>
</div>

<script>
// 書き込みは Vercel 側の API を通す。GitHub のトークンはあちらにあり、
// ここには来ない。この画面が持つのは暗証番号だけ。
const API = 'https://task-3days-mcp-server.vercel.app/api/tasks';
const PIN_KEY = 'task3days.pin';

// 日付に紐づかない置き場。mcp/lib/tasks.js と同じ約束にしてある
const ANYTIME = 'anytime';
const ANYTIME_HEADER = '# いつでも';
const ANYTIME_RE = /^#\s*(いつでも|anytime|inbox)\s*$/i;

const TYPE_MAP = {
  '前進':'accel','前進型':'accel','ぜんしん':'accel','A':'accel',
  'ルーチン':'routine','ルーチン型':'routine','R':'routine'
};

let pin = null;        // 端末に覚えさせた暗証番号。null なら読み取り専用
let lines = [];        // tasks.txt の現在の中身を1行ずつ。編集はここを直接いじる
let sha = null;        // GitHub 側の blob SHA。更新のたびに付け替える
let editing = false;   // メモを編集中か（編集中は自動リロードを止める）
let othersOpen = false; // 「その他の日」を開いているか。保存のたびに畳まないよう覚える
let busy = null;       // 保存中の Promise。連打しても直列に流す
let headers = new Map(); // 見出しが何行目にあるか。追加するときの差し込み先

/* ---------- tasks.txt の読み書き ---------- */

function parse(text){
  lines = text.split(/\r?\n/);
  headers = new Map();
  const days = new Map();
  let curDate = null, curTask = null;
  lines.forEach((raw, i) => {
    const line = raw.trim();
    if (!line) return;
    if (line.startsWith('//')) return;

    const d = line.match(/^#\s*(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (d || ANYTIME_RE.test(line)) {
      curDate = d
        ? `${d[1]}-${String(d[2]).padStart(2,'0')}-${String(d[3]).padStart(2,'0')}`
        : ANYTIME;
      if (!days.has(curDate)) { days.set(curDate, []); headers.set(curDate, i); }
      curTask = null;
      return;
    }

    const t = line.match(/^[-*]\s*\[([ xX✓])\]\s*(.*)$/);
    if (t && curDate) {
      const done = t[1].toLowerCase() !== ' ';
      const parts = t[2].split('|').map(s => s.trim());
      let time='', type='', proj='', title='';
      if (parts.length >= 4) { [time, type, proj] = parts; title = parts.slice(3).join(' | '); }
      else if (parts.length === 3) { [time, type] = parts; title = parts[2]; }
      else if (parts.length === 2) { time = parts[0]; title = parts[1]; }
      else { title = parts[0]; }
      curTask = { done, time: clean(time), type: clean(type), proj: clean(proj), title, memo:'', at:i, memoAt:[] };
      days.get(curDate).push(curTask);
      return;
    }

    const m = line.match(/^(?:memo|メモ)\s*[:：]\s*(.*)$/i);
    if (m && curTask) {
      curTask.memo = curTask.memo ? curTask.memo + '\n' + m[1] : m[1];
      curTask.memoAt.push(i);
      return;
    }
    if (curTask && /^[>|]/.test(line)) {
      const extra = line.replace(/^[>|]\s?/, '');
      curTask.memo = curTask.memo ? curTask.memo + '\n' + extra : extra;
      curTask.memoAt.push(i);
    }
  });
  return days;
}
const clean = s => (!s || s === '-' || s === 'ー' || s === '—') ? '' : s;

// チェック欄だけを差し替える。行の他の部分には触らない
function writeDone(at, done){
  lines[at] = lines[at].replace(/^(\s*[-*]\s*\[)[ xX✓](\])/, (_, a, b) => a + (done ? 'x' : ' ') + b);
}

// タスク行とそのメモ行を消す。後ろから消さないと位置がずれる
function writeRemove(task){
  [task.at, ...task.memoAt].sort((a, b) => b - a).forEach(i => lines.splice(i, 1));
}

// 「いつでも」の末尾にタスクを1本足す。見出しが無ければファイルの末尾に作る。
// title に | が入っていると列の区切りに見えるので、その場合だけ空欄を明示する
function writeAdd(title){
  const days = parse(lines.join('\n'));      // lines と headers を作り直す
  const row = title.includes('|') ? `- [ ] - | - | - | ${title}` : `- [ ] ${title}`;
  const list = days.get(ANYTIME) || [];
  if (headers.has(ANYTIME)) {
    const last = list.at(-1);
    const at = last ? Math.max(last.at, ...last.memoAt) + 1 : headers.get(ANYTIME) + 1;
    lines.splice(at, 0, row);
  } else {
    while (lines.length && lines.at(-1).trim() === '') lines.pop();
    lines.push('', ANYTIME_HEADER, row, '');
  }
}

// メモ行を丸ごと差し替える。1行につき memo: を1本、で往復できる
function writeMemo(task, text){
  const indent = (lines[task.at].match(/^\s*/) || [''])[0] + '  ';
  const block = text.split('\n').map(s => s.trim()).filter(Boolean).map(s => indent + 'memo: ' + s);
  const old = task.memoAt.slice().sort((a,b) => a - b);
  if (old.length) {
    for (let k = old.length - 1; k >= 0; k--) lines.splice(old[k], 1);
    lines.splice(old[0], 0, ...block);
  } else {
    lines.splice(task.at + 1, 0, ...block);
  }
}

/* ---------- 保存先の API ---------- */

async function fail(res){
  let msg = '';
  try { msg = (await res.json()).error || ''; } catch { /* 本文なし */ }
  if (res.status === 401) return new Error('暗証番号が違います');
  if (res.status === 503) return new Error('サーバー側の設定が未完了です');
  return new Error(msg || 'HTTP ' + res.status);
}

async function apiRead(){
  const res = await fetch(`${API}?t=${Date.now()}`, {
    headers: { 'X-Pin': pin }, cache:'no-store'
  });
  if (!res.ok) throw await fail(res);
  const json = await res.json();
  sha = json.sha;
  return json.text;
}

async function apiWrite(text, message){
  const res = await fetch(API, {
    method:'PUT',
    headers: { 'X-Pin': pin, 'Content-Type':'application/json' },
    body: JSON.stringify({ text, sha, message })
  });
  if (res.status === 409) throw new Error('conflict');
  if (!res.ok) throw await fail(res);
  sha = (await res.json()).sha;
}

// lines を書き換えたあとに呼ぶ。保存 → 再描画までまとめて面倒を見る
function save(message){
  const run = async () => {
    say('保存中…');
    const text = lines.join('\n');
    try {
      await apiWrite(text, message);
      render(parse(text));
      say('保存しました');
    } catch (e) {
      if (e.message === 'conflict') {
        say('他で更新されていたので読み直しました', true);
        await load();
      } else {
        say(e.message, true);
        await load();
      }
    }
  };
  busy = (busy || Promise.resolve()).then(run, run);
  return busy;
}

/* ---------- 表示 ---------- */

function ymd(dt){
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function label(key){
  if (key === ANYTIME) return 'いつでも';
  const [y,m,d] = key.split('-').map(Number);
  const dow = ['日','月','火','水','木','金','土'][new Date(y, m-1, d).getDay()];
  return `${m}月${d}日（${dow}）`;
}
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

function say(msg, bad){
  const n = document.getElementById('say');
  n.textContent = msg || '';
  n.classList.toggle('bad', !!bad);
}

function openMemoEditor(card, task){
  if (card.querySelector('.memo-edit')) return;
  editing = true;
  const wrap = el('div','memo-edit');
  const ta = el('textarea');
  ta.value = task.memo;
  const row = el('div','row');
  const ok = el('button', 'primary', '保存');
  const cancel = el('button', null, 'やめる');
  row.append(ok, cancel);
  wrap.append(ta, row);

  const shown = card.querySelector('.memo');
  if (shown) shown.hidden = true;
  card.append(wrap);
  ta.focus();

  const close = () => { editing = false; wrap.remove(); if (shown) shown.hidden = false; };
  cancel.addEventListener('click', close);
  ok.addEventListener('click', () => {
    const next = ta.value;
    close();
    if (next.trim() === task.memo.trim()) return;
    writeMemo(task, next);
    save(`tasks: メモを更新（${task.title}）`);
  });
}

function renderDay(key, rel, tasks, isToday){
  const sec = el('section', 'day' + (isToday ? ' is-today' : '') + (key === ANYTIME ? ' is-anytime' : ''));
  const head = el('div','day-head');
  head.append(el('span','day-date', label(key)), el('span','day-rel', rel));
  const list = tasks || [];
  if (list.length) head.append(el('span','day-count', `${list.filter(t=>t.done).length}/${list.length}`));
  sec.append(head);

  if (!list.length) { sec.append(el('div','empty','—')); return sec; }

  for (const t of list) {
    const card = el('div','task' + (t.done ? ' done' : '') + (pin ? ' can-edit' : ''));

    let box;
    if (pin) {
      box = el('button','box');
      box.setAttribute('aria-label', (t.done ? '未完了に戻す: ' : '完了にする: ') + t.title);
      box.addEventListener('click', () => {
        card.classList.add('busy');
        writeDone(t.at, !t.done);
        save(`tasks: ${t.done ? '未完了に戻す' : '完了'}（${t.title}）`);
      });
    } else {
      box = el('div','box');
    }
    card.append(box, el('div','title', t.title));

    if (pin) {
      const del = el('button','del','✕');
      del.setAttribute('aria-label', '削除: ' + t.title);
      del.addEventListener('click', () => {
        if (!confirm(`「${t.title}」を消しますか？\n（GitHub の履歴には残ります）`)) return;
        card.classList.add('busy');
        writeRemove(t);
        save(`tasks: 削除（${t.title}）`);
      });
      card.append(del);
    }

    const meta = el('div','meta');
    if (t.time) meta.append(el('span','tag t-time', t.time));
    if (t.type) {
      const k = TYPE_MAP[t.type] || '';
      meta.append(el('span', 'tag ' + (k ? 't-'+k : 't-proj'), t.type));
    }
    if (t.proj) meta.append(el('span','tag t-proj', t.proj));
    if (pin && !t.memo) {
      const add = el('button','memo-add','＋メモ');
      add.addEventListener('click', () => openMemoEditor(card, t));
      meta.append(add);
    }
    if (meta.childNodes.length) card.append(meta);

    if (t.memo) {
      const memo = el('div','memo', t.memo);
      if (pin) memo.addEventListener('click', () => openMemoEditor(card, t));
      card.append(memo);
    }
    sec.append(card);
  }
  return sec;
}

function render(days){
  const app = document.getElementById('app');
  const keepY = window.scrollY;   // 作り直すので、見ていた位置に戻す
  app.textContent = '';
  const now = new Date();
  const todayKey = ymd(now);
  const window3 = [-1, 0, 1].map(off => {
    const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off);
    return { key: ymd(dt), rel: ['昨日','今日','明日'][off + 1] };
  });

  for (const w of window3) {
    app.append(renderDay(w.key, w.rel, days.get(w.key), w.key === todayKey));
  }

  // 「いつでも」は日付の窓の外だが、畳まない。忘れないための置き場なので常に見える
  const anytime = days.get(ANYTIME);
  if (anytime && anytime.length) app.append(renderDay(ANYTIME, '日付なし', anytime, false));

  const others = [...days.keys()]
    .filter(k => k !== ANYTIME && !window3.some(w => w.key === k)).sort();
  if (others.length) {
    const det = el('details','other');
    det.open = othersOpen;                                   // 開いていたら開いたまま
    det.addEventListener('toggle', () => { othersOpen = det.open; });
    det.append(el('summary', null, `その他の日（${others.length}日分）`));
    for (const k of others) det.append(renderDay(k, '', days.get(k), false));
    app.append(det);
  }

  document.getElementById('stamp').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ' 時点';

  if (keepY) window.scrollTo(0, keepY);
}

function showMode(){
  const n = document.getElementById('mode');
  n.textContent = pin ? '編集できます' : '読み取り専用';
  n.classList.toggle('rw', !!pin);
  document.getElementById('quick').hidden = !pin;
}

/* ---------- 読み込み ---------- */

async function load(){
  try {
    let text;
    if (pin) {
      text = await apiRead();
    } else {
      const res = await fetch('tasks.txt?t=' + Date.now(), { cache:'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      text = await res.text();
    }
    render(parse(text));
  } catch (e) {
    const app = document.getElementById('app');
    app.textContent = '';
    const box = el('div','err');
    box.append(document.createTextNode('tasks.txt を読み込めませんでした（' + e.message + '）。'));
    app.append(box);
  }
}

/* ---------- 暗証番号 ---------- */

const remember = v => { try { localStorage.setItem(PIN_KEY, v); return true; } catch (e) { return false; } };

// URL の ?k= が最優先。端末の記憶が消えても、その URL で開けば編集できる。
function loadPin(){
  let fromUrl = null;
  try { fromUrl = new URL(location.href).searchParams.get('k'); } catch (e) {}
  if (fromUrl) { pin = fromUrl; remember(fromUrl); }
  else {
    try { pin = localStorage.getItem(PIN_KEY) || null; } catch (e) { pin = null; }
  }
  showMode();
}

document.getElementById('gear').addEventListener('click', () => {
  const p = document.getElementById('panel');
  p.hidden = !p.hidden;
  if (!p.hidden) document.getElementById('pin').value = '';
});
document.getElementById('panel-close').addEventListener('click', () => {
  document.getElementById('panel').hidden = true;
});
document.getElementById('pin-save').addEventListener('click', async () => {
  const v = document.getElementById('pin').value.trim();
  if (!v) { say('暗証番号が空です', true); return; }
  const prev = pin;
  pin = v;
  say('確認中…');
  try {
    await apiRead();                       // 通ったものだけ覚える
    if (!remember(v)) say('この端末には覚えさせられませんでした', true);
    document.getElementById('pin').value = '';
    document.getElementById('panel').hidden = true;
    showMode();
    say('編集できます');
    await load();
  } catch (e) {
    pin = prev;
    showMode();
    say(e.message, true);
  }
});
document.getElementById('pin-clear').addEventListener('click', async () => {
  try { localStorage.removeItem(PIN_KEY); } catch (e) {}
  pin = null; sha = null;
  document.getElementById('pin').value = '';
  showMode();
  render(parse(lines.join('\n')));   // 読み込みを待たずに操作を止める
  say('暗証番号を削除しました');
  await load();
});

document.getElementById('quick').addEventListener('submit', e => {
  e.preventDefault();
  const box = document.getElementById('quick-text');
  const title = box.value.trim();
  if (!title) return;
  box.value = '';
  box.blur();                    // iOS のキーボードを閉じる
  writeAdd(title);
  save(`tasks: 追加（${title}）`);
});

document.getElementById('reload').addEventListener('click', () => { say(''); load(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !editing) load(); });

loadPin();
load();
</script>
