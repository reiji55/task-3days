<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>task-3days MCP</title>
<style>
:root{ --bg:#f6f6f4; --panel:#fff; --line:#e3e2dd; --ink:#1c1b19; --ink-2:#5f5d57; --ink-3:#8d8a82; --ok:#1f6f4a; --ok-bg:#e4f0e9 }
@media (prefers-color-scheme:dark){
  :root{ --bg:#131311; --panel:#1c1c1a; --line:#2e2e2b; --ink:#eceae4; --ink-2:#a5a29a; --ink-3:#76736c; --ok:#7fd0a4; --ok-bg:#1b3128 }
}
*{box-sizing:border-box}
body{
  margin:0; padding:40px 20px; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
main{max-width:520px;margin:0 auto}
h1{font-size:17px;font-weight:650;margin:0 0 4px;letter-spacing:.02em}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:2px 10px;vertical-align:2px;margin-left:8px}
p{margin:0 0 14px;color:var(--ink-2);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin:18px 0}
.card h2{font-size:13px;font-weight:650;margin:0 0 8px;color:var(--ink)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
ul{margin:0;padding-left:1.2em;color:var(--ink-2);font-size:13px}
li{margin:3px 0}
a{color:inherit}
footer{margin-top:22px;font-size:12px;color:var(--ink-3)}
</style>
</head>
<body>
<main>
  <h1>task-3days MCP<span class="tag">稼働中</span></h1>
  <p>3日間タスクビューアの <code>tasks.txt</code> を読み書きする MCP サーバー。</p>

  <div class="card">
    <h2>このページが見えている＝デプロイは成功</h2>
    <p style="margin:0">
      MCP の窓口は <code>/api/mcp/&lt;合鍵&gt;</code> にあり、合鍵が合わない URL には
      <code>404</code> を返します。ブラウザで直接開くところではありません。
      接続は claude.ai のカスタムコネクタから行います。
    </p>
  </div>

  <div class="card">
    <h2>できること</h2>
    <ul>
      <li>3日分（昨日・今日・明日）のタスクを読む</li>
      <li>チェックの付け外し、メモの書き換え</li>
      <li>タスクの追加・更新・繰り越し・削除</li>
    </ul>
  </div>

  <footer>
    <a href="https://reiji55.github.io/task-3days/">ビューア</a> ・
    <a href="https://github.com/reiji55/task-3days/tree/main/mcp">ソース</a>
  </footer>
</main>
</body>
</html>
